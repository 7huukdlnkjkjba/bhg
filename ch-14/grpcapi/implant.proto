syntax = "proto3";
package grpcapi;
option go_package = "./";

// Implant defines our C2 API functions
service Implant {
    rpc FetchCommand (Empty) returns (Command);
    rpc SendOutput (Command) returns (Empty);
}

// Admin定义我们的Admin API函数
service Admin {
    rpc RunCommand (Command) returns (Command);
}

// Command定义具有输入和输出字段的消息
message Command {
    string In = 1;
    string Out = 2;
}

// Empty定义一个用于替代null的空消息
message Empty {
}
